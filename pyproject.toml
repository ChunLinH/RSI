[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-rsi-monitor"
version = "0.2.0"
description = "Windows 桌面版股票 RSI 实时盯盘助手"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
rsi-monitor = "rsi_monitor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
