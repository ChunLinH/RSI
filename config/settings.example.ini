[app]
symbol = 000001
price_history_size = 200
refresh_interval_seconds = 1
monitor_state_file_path = monitor_sessions.json
default_monitoring_period = 1min
allowed_monitoring_periods = 1min, 5min, 15min

[market_data]
provider = tencent_china
alpha_vantage_api_key =
alpha_vantage_base_url = https://www.alphavantage.co/query
alpha_vantage_entitlement = realtime
alpha_vantage_timezone = America/New_York
request_timeout_seconds = 10
max_retries = 3
retry_delay_seconds = 2
history_retry_delay_seconds = 30
cache_directory = market_cache

[indicator]
rsi_periods = 6
signal_rsi_period = 6

[signals]
buy_rsi_threshold = 30
sell_rsi_threshold = 70

[notifications]
# 默认关闭通知。需要微信通知时，将 provider 改为 wxpusher，填写自己的 SPT，
# 并将 notification_enabled 改为 true。
provider = console
notification_enabled = false
serverchan_sendkey =
wxpusher_spt =
request_timeout_seconds = 5

[chart]
auto_hide_on_focus_loss = true
default_indicator = rsi
data_limit = 240
refresh_interval_seconds = 15
show_call_auction = true
quote_panel_collapsed = false

[logging]
level = INFO
file_path = logs/rsi_monitor.log
